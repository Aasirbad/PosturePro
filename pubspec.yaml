name: posture_detection
description: Real-time posture detection for 10 gym exercises using ML Kit

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.10.5+9

  # ML Kit Pose Detection
  google_mlkit_pose_detection: ^0.11.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
